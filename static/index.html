<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>mBot2 control</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #262c35; --text: #e6e9ee; --dim: #8b95a3;
    --accent: #3fb6ff; --ok: #3ddc84; --warn: #ffb020; --bad: #ff5468;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .02em; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--dim); }
  .badge.ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .badge.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .badge.bad { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
  header .spacer { flex: 1; }
  header .batt { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }

  main { flex: 1; display: grid; gap: 14px; padding: 14px; grid-template-columns: minmax(280px, 1fr) minmax(280px, 380px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }

  .drive { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  #pad { width: min(78vw, 300px); aspect-ratio: 1; border-radius: 50%; position: relative; touch-action: none;
    background: radial-gradient(circle, #1d232b 0 60%, #1a1f26 61%); border: 1px solid var(--line); cursor: grab; }
  #pad::before, #pad::after { content: ""; position: absolute; background: var(--line); }
  #pad::before { left: 50%; top: 10%; bottom: 10%; width: 1px; }
  #pad::after { top: 50%; left: 10%; right: 10%; height: 1px; }
  #knob { position: absolute; width: 30%; aspect-ratio: 1; border-radius: 50%; left: 35%; top: 35%; z-index: 1;
    background: radial-gradient(circle at 35% 30%, #6fcbff, var(--accent)); box-shadow: 0 6px 18px #0008; transition: transform .12s; }
  #pad.active #knob { transition: none; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; }
  .row label { color: var(--dim); font-size: 13px; min-width: 52px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .num { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  #stop { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; letter-spacing: .1em; border: 0; border-radius: 12px;
    background: var(--bad); color: #fff; cursor: pointer; }
  #stop:active { transform: scale(.98); }
  .hint { color: var(--dim); font-size: 12px; text-align: center; }
  kbd { background: var(--line); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

  .side { display: flex; flex-direction: column; gap: 14px; }
  .dist-val { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .dist-val small { font-size: 14px; color: var(--dim); font-weight: 400; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width .15s, background .15s; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .kv { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .kv span:first-child { color: var(--dim); }
  .line { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .line i { width: 34px; height: 14px; border-radius: 7px; background: var(--line); }
  .line i.on { background: var(--text); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .btns button, .say button { border: 1px solid var(--line); background: #1e242c; color: var(--text); border-radius: 9px; padding: 8px 12px; cursor: pointer; font: inherit; }
  .btns button:hover, .say button:hover { border-color: var(--accent); }
  .sw { width: 22px; height: 22px; border-radius: 50%; display: inline-block; vertical-align: middle; }
  .say { display: flex; gap: 8px; margin-top: 10px; }
  .say input { flex: 1; min-width: 0; background: #0f1216; color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; }
  #banner { display: none; margin: 14px 14px 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); font-size: 14px; }
  #banner.show { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  #banner button { border: 1px solid var(--warn); background: transparent; color: var(--warn); border-radius: 9px; padding: 7px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  #banner button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>mBot2</h1>
  <span id="link" class="badge">connecting…</span>
  <span id="base" class="badge">base ?</span>
  <span class="spacer"></span>
  <span class="batt" id="batt">— %</span>
</header>
<div id="banner"><span id="bannertext"></span> <button id="redetect">Re-detect base</button></div>
<main>
  <section class="panel drive">
    <div id="pad"><div id="knob"></div></div>
    <div class="row">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="20" max="200" step="10" value="80">
      <span class="num" id="speedv">80</span>
    </div>
    <button id="stop">STOP</button>
    <div class="hint">Drag the pad, or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows · <kbd>Space</kbd> stops</div>
  </section>

  <section class="side">
    <div class="panel">
      <h2>Distance ahead</h2>
      <div class="dist-val"><span id="dist">—</span> <small>cm</small></div>
      <div class="bar"><div id="distbar"></div></div>
    </div>
    <div class="panel">
      <h2>Sensors</h2>
      <div class="line" id="line"><i></i><i></i><i></i><i></i></div>
      <div class="hint" style="margin:6px 0 10px">line sensor (floor)</div>
      <div class="grid2">
        <div class="kv"><span>Left wheel</span><span id="em1">—</span></div>
        <div class="kv"><span>Right wheel</span><span id="em2">—</span></div>
        <div class="kv"><span>Roll</span><span id="roll">—</span></div>
        <div class="kv"><span>Pitch</span><span id="pitch">—</span></div>
        <div class="kv"><span>Light</span><span id="light">—</span></div>
        <div class="kv"><span>Sound</span><span id="loud">—</span></div>
      </div>
    </div>
    <div class="panel">
      <h2>Fun</h2>
      <div class="btns" id="leds">
        <button data-c="255,0,0"><span class="sw" style="background:#f33"></span></button>
        <button data-c="0,255,0"><span class="sw" style="background:#3d5"></span></button>
        <button data-c="0,80,255"><span class="sw" style="background:#36f"></span></button>
        <button data-c="255,0,200"><span class="sw" style="background:#f3c"></span></button>
        <button data-c="255,160,0"><span class="sw" style="background:#fa0"></span></button>
        <button data-off>LEDs off</button>
      </div>
      <div class="btns" style="margin-top:8px">
        <button data-beep="523">Beep</button>
        <button data-beep="1046">High beep</button>
        <button data-beep="262">Low beep</button>
      </div>
      <form class="say" id="say">
        <input id="saytext" maxlength="40" placeholder="Text for its screen">
        <button>Show</button>
      </form>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let ws, joy = { x: 0, y: 0 }, keys = new Set(), padActive = false;

  // ---- websocket ----------------------------------------------------------
  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
    ws.onopen = () => setBadge("link", "page linked", "warn");
    ws.onclose = () => { setBadge("link", "server offline", "bad"); setTimeout(connect, 1500); };
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "link") {
        const map = { up: ["robot linked", "ok"], connecting: ["connecting to robot…", "warn"], down: ["robot link down", "bad"] };
        setBadge("link", ...map[m.state]);
      } else if (m.type === "telemetry") telemetry(m);
    };
  }
  const send = obj => ws && ws.readyState === 1 && ws.send(JSON.stringify(obj));
  function setBadge(id, text, cls) { const el = $(id); el.textContent = text; el.className = "badge " + (cls || ""); }

  // ---- telemetry ----------------------------------------------------------
  const fmt = (v, d = 0) => (typeof v === "number" ? v.toFixed(d) : "—");
  function telemetry(t) {
    const baseOn = t.shield === "mbot2";
    setBadge("base", baseOn ? "base on" : t.shield === "unknown" ? "no reply" : "base off", baseOn ? "ok" : "bad");
    const banner = $("banner");
    banner.classList.toggle("show", !baseOn);
    $("bannertext").textContent = baseOn ? "" : "No mBot2 base detected. The CyberPi only checks for the base when it starts up: turn the base on (if it still isn't found, switch it off and on again), then press Re-detect.";
    if (!baseOn) return;
    $("batt").textContent = fmt(t.batt) + " %";
    $("dist").textContent = t.dist >= 300 ? "300+" : fmt(t.dist, 1);
    const pct = Math.min(100, (t.dist / 100) * 100);
    const bar = $("distbar");
    bar.style.width = pct + "%";
    bar.style.background = t.dist < 15 ? "var(--bad)" : t.dist < 40 ? "var(--warn)" : "var(--ok)";
    [...$("line").children].forEach((el, i) => el.classList.toggle("on", !!(t.line & (8 >> i))));
    $("em1").textContent = fmt(t.em1) + " rpm"; $("em2").textContent = fmt(Math.abs(t.em2)) + " rpm";
    $("roll").textContent = fmt(t.roll) + "°"; $("pitch").textContent = fmt(t.pitch) + "°";
    $("light").textContent = fmt(t.light); $("loud").textContent = fmt(t.loud);
  }

  // ---- driving ------------------------------------------------------------
  const speed = $("speed");
  speed.oninput = () => ($("speedv").textContent = speed.value);

  function mix(x, y) {
    const max = +speed.value, turn = 0.6;
    let l = y * max + x * max * turn, r = y * max - x * max * turn;
    const k = Math.max(1, Math.abs(l) / max, Math.abs(r) / max);
    return [Math.round(l / k), Math.round(r / k)];
  }
  function keyVector() {
    const has = (...k) => k.some(c => keys.has(c));
    return {
      x: (has("d", "arrowright") ? 1 : 0) - (has("a", "arrowleft") ? 1 : 0),
      y: (has("w", "arrowup") ? 1 : 0) - (has("s", "arrowdown") ? 1 : 0),
    };
  }
  // send ~10x/s while anything is held; server watchdog stops the robot when we go quiet
  setInterval(() => {
    const v = padActive ? joy : keyVector();
    if (padActive || v.x || v.y) { const [l, r] = mix(v.x, v.y); send({ type: "drive", l, r }); }
  }, 100);

  const stop = () => { padActive = false; keys.clear(); resetKnob(); send({ type: "stop" }); };
  $("stop").onclick = stop;

  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === " ") { e.preventDefault(); stop(); return; }
    if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) { e.preventDefault(); keys.add(k); }
  });
  addEventListener("keyup", e => {
    keys.delete(e.key.toLowerCase());
    const v = keyVector();
    if (!padActive && !v.x && !v.y) send({ type: "stop" });
  });
  addEventListener("blur", stop);
  document.addEventListener("visibilitychange", () => document.hidden && stop());

  const pad = $("pad"), knob = $("knob");
  function resetKnob() { joy = { x: 0, y: 0 }; knob.style.transform = ""; pad.classList.remove("active"); }
  function padMove(e) {
    const r = pad.getBoundingClientRect(), R = r.width / 2;
    let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R;
    const d = Math.hypot(dx, dy); if (d > 1) { dx /= d; dy /= d; }
    joy = { x: dx, y: -dy };
    knob.style.transform = `translate(${dx * R * 0.7}px, ${dy * R * 0.7}px)`;
  }
  pad.addEventListener("pointerdown", e => { padActive = true; pad.classList.add("active"); pad.setPointerCapture(e.pointerId); padMove(e); });
  pad.addEventListener("pointermove", e => padActive && padMove(e));
  const padUp = () => { if (!padActive) return; padActive = false; resetKnob(); send({ type: "stop" }); };
  pad.addEventListener("pointerup", padUp);
  pad.addEventListener("pointercancel", padUp);

  // ---- fun ----------------------------------------------------------------
  $("leds").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-off")) return send({ type: "led_off" });
    const [r, g, bl] = b.dataset.c.split(",").map(Number);
    send({ type: "led", r, g, b: bl });
  };
  document.querySelectorAll("[data-beep]").forEach(b => (b.onclick = () => send({ type: "beep", freq: +b.dataset.beep })));
  $("redetect").onclick = () => {
    const b = $("redetect"); b.disabled = true; b.textContent = "Restarting…";
    send({ type: "redetect" });
    setTimeout(() => { b.disabled = false; b.textContent = "Re-detect base"; }, 12000);
  };
  $("say").onsubmit = e => { e.preventDefault(); send({ type: "say", text: $("saytext").value }); };

  connect();
})();
</script>
</body>
</html>
